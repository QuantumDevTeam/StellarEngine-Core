name: Release

# A release is a decision, taken by hand: a new StellarOrchesterVersion in Shared/Build/Stellar.Versions.props
# (Docs/Engine/Versioning.md). When master carries a version that has no tag yet, this workflow turns the decision
# into the tag v<version> and a GitHub release of the core.
#
# The orchestra is released by the mirror: its workflow tags the snapshot with the same version and publishes the
# release the installer installs. With the variable STELLAR_MIRROR_APP_ID and the secret STELLAR_MIRROR_APP_KEY (the app
# that writes the mirror, see mirror.yml) this workflow starts it at once; without them the release of the orchestra
# waits for Run workflow in the mirror. Merge the modules into their master before the core: a snapshot takes it.
#
# The mirror holds this file too, as everything of the core: it never runs there (STELLAR_MIRROR is 'true').

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release the core
    if: vars.STELLAR_MIRROR != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Nothing that a mark stops is released: a tag cannot be taken back
      - name: Check the marks
        run: |
          mkdir -p packages
          dotnet run --project SDK/src/Stellar.Cli/Stellar.Cli.csproj -- marks check --stage release

      - name: Tag and publish
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $props = Get-Content Shared/Build/Stellar.Versions.props -Raw
          function Get-Version([string]$Name) { [regex]::Match($props, "<$Name>([^<]+)</$Name>").Groups[1].Value }

          $version = Get-Version 'StellarOrchesterVersion'
          $tag = "v$version"
          if (git tag --list $tag) {
            Write-Host "$tag exists: nothing to release"
            "released=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $site = Get-Version 'StellarSiteUri'
          $components = 'Kernel', 'Core', 'Runtime', 'Tools', 'Sdk', 'Cli' |
            ForEach-Object { "| Stellar.$_ | $(Get-Version "Stellar$($_)Version") |" }
          $notes = @(
            "The core of StellarEngine $version.",
            '',
            '| Component | Version |',
            '|---|---|'
          ) + $components + @(
            '',
            'Install the orchestra of this version:',
            '',
            '```powershell',
            "`$env:STELLAR_INSTALL_VERSION='$version'; irm ${site}install.ps1 | iex",
            '```'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          $notes -join "`n" | Set-Content -Encoding utf8 $notesFile

          # A suffix (-alpha, -rc.1) makes a pre-release, which is never the latest one an installer takes
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag --target $env:GITHUB_SHA --title "StellarEngine-Core $version" --notes-file $notesFile --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }
          "released=true" >> $env:GITHUB_OUTPUT

      # Only a release starts the mirror. Without the app here, Run workflow in the mirror does it
      - name: Token of the mirror app
        id: app
        if: steps.release.outputs.released == 'true' && vars.STELLAR_MIRROR_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STELLAR_MIRROR_APP_ID }}
          private-key: ${{ secrets.STELLAR_MIRROR_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: StellarEngine-Mono
          permission-contents: write

      - name: Start the mirror
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api "repos/${{ github.repository_owner }}/StellarEngine-Mono/dispatches" -f event_type=orchestra-release
