name: Tests

# Builds everything, native and managed, and runs the tests. One workflow for every repository, as marks.yml: the core
# runs it as it is; a module calls it and is checked out into modules/ of a checkout of the core.
#
# Windows with the Visual Studio the native toolset asks for (Shared/Build/Stellar.Native.props), C++/CLI included.
#
# By itself only on the way into master; on any other branch by hand (Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    if: vars.STELLAR_MIRROR != 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      IS_CORE: ${{ github.event.repository.name == 'StellarEngine-Core' }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        if: env.IS_CORE == 'true'
        uses: actions/checkout@v5

      - name: Checkout the core
        if: env.IS_CORE != 'true'
        uses: actions/checkout@v5
        with:
          repository: QuantumDevTeam/StellarEngine-Core
          ref: develop

      - name: Checkout the module
        if: env.IS_CORE != 'true'
        uses: actions/checkout@v5
        with:
          path: modules/${{ github.event.repository.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and test the core
        if: env.IS_CORE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          ./scripts/build.ps1 -Configuration Debug

      # Its own tests ran in the repository of the core
      - name: Install the core
        if: env.IS_CORE != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          ./scripts/build.ps1 -Configuration Debug -SkipTests -Install -NoUserRegistration -SkipModules

      - name: Build and test the module
        if: env.IS_CORE != 'true'
        shell: pwsh
        env:
          MODULE: ${{ github.event.repository.name }}
        run: |
          dotnet run --project SDK/src/Stellar.Cli/Stellar.Cli.csproj -c Debug --no-build -- modules build $env:MODULE --tests --pack
          exit $LASTEXITCODE
